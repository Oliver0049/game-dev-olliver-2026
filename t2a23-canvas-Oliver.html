
<h2 align="center">t2a23-canvas-Oliver.html</h2>

<input type="button" value="Draw Basic Shapes" onClick="{

   // 1. Clear the canvas
   myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

   // 2. Draw a black line
   myContext.beginPath();
   myContext.lineWidth = 3;
   myContext.strokeStyle = 'black';
   myContext.moveTo(20, 20);
   myContext.lineTo(150, 20);
   myContext.stroke();

   // 3. Draw a blue rectangle
   myContext.fillStyle = 'blue';
   myContext.fillRect(30, 50, 100, 60);

   // 4. Draw a green circle
   myContext.beginPath();
   myContext.lineWidth = 5;
   myContext.strokeStyle = 'green';
   myContext.arc(220, 80, 40, 0, 2 * Math.PI);
   myContext.stroke();

   // 5. Write red text
   myContext.fillStyle = 'red';
   myContext.font = '24px Arial';
   myContext.fillText('Hello World!', 30, 180);

   // 6. Draw an orange triangle
   myContext.beginPath();
   myContext.fillStyle = 'orange';
   myContext.moveTo(350, 30);
   myContext.lineTo(400, 100);
   myContext.lineTo(300, 100);
   myContext.closePath();
   myContext.fill();

   // 7. Draw a yellow star
   myContext.beginPath();
   myContext.fillStyle = 'gold';
   myContext.moveTo(220, 150);
   myContext.lineTo(235, 180);
   myContext.lineTo(270, 185);
   myContext.lineTo(245, 205);
   myContext.lineTo(250, 240);
   myContext.lineTo(220, 220);
   myContext.lineTo(190, 240);
   myContext.lineTo(195, 205);
   myContext.lineTo(170, 185);
   myContext.lineTo(205, 180);
   myContext.closePath();
   myContext.fill();

   // 8. Draw a purple oval
   myContext.beginPath();
   myContext.fillStyle = 'purple';
   myContext.ellipse(390, 190, 50, 25, 0, 0, 2 * Math.PI);
   myContext.fill();

   // 9. Draw an orange pentagon
   myContext.beginPath();
   myContext.fillStyle = 'orange';
   myContext.moveTo(100, 220);
   myContext.lineTo(140, 250);
   myContext.lineTo(125, 285);
   myContext.lineTo(75, 285);
   myContext.lineTo(60, 250);
   myContext.closePath();
   myContext.fill();

   // 10. Draw a pink diamond
   myContext.beginPath();
   myContext.fillStyle = 'hotpink';
   myContext.moveTo(310, 220);
   myContext.lineTo(350, 250);
   myContext.lineTo(310, 280);
   myContext.lineTo(270, 250);
   myContext.closePath();
   myContext.fill();

}"><br><br>

<!-- Canvas -->
<canvas id="myCoolTag" width="500" height="300"
style="border:1px solid #000000;"></canvas>

<script>
   // Set up canvas variables
   let myCanvas = document.getElementById('myCoolTag');
   let myContext = myCanvas.getContext('2d');
</script>
