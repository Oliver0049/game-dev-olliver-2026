Classes are objects that define properties (variables)
and methods (functions).

<h4>Example working code</h4>

Nothing: <input type="text" id="myText01"
value="useless at the moment"><br>

<input type="button"
value="Example Class Set and Show Class Animal"
onclick="{

  class myAnimal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
    }

    myShow() {
      document.getElementById('myDiv01').innerHTML =
        'Hello ' + this.myName +
        '. You are ' + this.myAge +
        ' years old<br>';
    }
  }

  let myDog = new myAnimal('snickers', 5);
  myDog.myShow();

}">

<div id="myDiv01">...</div>
