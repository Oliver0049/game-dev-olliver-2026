<!DOCTYPE html>
<html>
<head>
    <h1 align=center>t2a19-json-Oliver.html</h1>
</head>
<body>

    <h2>JSON Information Page</h2>
    <p>Click the button to display information stored in JSON.</p>

    <button onclick="showInfo()">Show Information</button>

    <h3 id="name"></h3>
    <p id="game"></p>
    <p id="rank"></p>
    <p id="platform"></p>

    <script>
        let player = {
            "name": "Oliver",
            "game": "Rocket League",
            "rank": "Champion",
            "platform": "PlayStation 5"
        };

        function showInfo() {
            document.getElementById("name").innerHTML =
                player.name;

            document.getElementById("game").innerHTML =
                "Game: " + player.game;

            document.getElementById("rank").innerHTML =
                "Rank: " + player.rank;

            document.getElementById("platform").innerHTML =
                "Platform: " + player.platform;
        }
    </script>

</body>
</html>
